<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AETHER-052 · Active RGB Foam</title><style>body{background:#090e18;color:#e6edf7;font:15px system-ui;margin:0}main{max-width:960px;margin:auto;padding:24px}canvas{width:100%;height:420px;background:#101928;border:1px solid #34435b;border-radius:12px}button,input{accent-color:#55ee99}button{padding:10px;background:#15283a;color:#b7ffdc;border:1px solid #468d73;border-radius:6px}section{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:16px 0}output{font-size:20px;color:#e9d293}small{color:#a5b3ca}</style><main><small>AETHER / 052 / .dlw</small><h1>Active RGB Homeostasis</h1><p>N −CMB · O −+CMB+− · H +CMB | 1 × 1.025″ architecture</p><canvas id="c"></canvas><section><label><input id="active" type="checkbox" checked> Active return</label><label><input id="shock" type="checkbox" checked> Disturbance at 32</label><label>Iteration <input id="t" type="range" min="0" max="128" value="32"></label><button id="next">Iterate</button><button id="reset">Reset</button></section><output id="out"></output><p>Target distribution 50/30/20. Return flux is an abstract control budget, not physical work or heat. Bubble rendering schematic; no actual physical Planck foam simulated.</p></main><script>function sim(active=true,steps=128,disturb=true){let a=[.5,.3,.2],trace=[],work=0;for(let t=0;t<=steps;t++){if(disturb&&t===32){a[0]-=.1;a[2]+=.1}let f=.035*(a[0]-a[1]),g=.085*(a[1]-a[2]);let u=active?Math.max(-.04,Math.min(.04,.035*.2+.25*(.5-a[0]))):0,v=active?Math.max(-.04,Math.min(.04,.085*.1+.25*(a[2]-.2))):0;trace.push({t,a:a.slice(),error:a.reduce((s,x,i)=>s+Math.abs(x-[.5,.3,.2][i]),0),total:a.reduce((s,x)=>s+x,0),work});if(t===steps)break;a=[a[0]-f+u,a[1]+f-g-u+v,a[2]+g-v];work+=Math.abs(u)+Math.abs(v)}return trace}
const $=x=>document.getElementById(x),c=$("c"),ctx=c.getContext("2d");function draw(){let t=+$("t").value,r=sim($("active").checked,t,$("shock").checked).at(-1),w=c.clientWidth,h=c.clientHeight,d=devicePixelRatio||1;c.width=w*d;c.height=h*d;ctx.scale(d,d);let colors=["#398fff","#42ed82","#ff505a"];for(let l=0;l<3;l++){let y=70+l*135;ctx.fillStyle=colors[l];ctx.font="bold 15px system-ui";ctx.fillText(["N / −CMB","O / −+CMB+−","H / +CMB"][l],20,y-40);for(let j=0;j<9;j++)for(let k=0;k<3;k++){let x=55+j*(w-110)/8+k*5;ctx.globalAlpha=.25+r.a[l];ctx.strokeStyle=colors[l];ctx.shadowColor=colors[l];ctx.shadowBlur=10;ctx.beginPath();ctx.arc(x,y+k*17,12,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.ellipse(x,y+k*17,12,4,(t+j)*.1,0,Math.PI*2);ctx.stroke();}ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.fillRect(20,y+55,(w-40)*r.a[l],5);} $("out").textContent="t="+t+" | "+r.a.map(v=>(v*100).toFixed(2)+"%").join(" / ")+" | total "+r.total.toFixed(9)+" | control budget "+r.work.toFixed(3)};["active","shock","t"].forEach(x=>$(x).oninput=draw);$("next").onclick=()=>{$("t").value=Math.min(128,+$("t").value+1);draw()};$("reset").onclick=()=>{$("t").value=0;draw()};addEventListener("resize",draw);draw();</script></html>
