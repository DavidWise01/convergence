<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CUBIT-013</title><style>body{margin:0;background:#09131b;color:#dcece9;font:15px system-ui}main{max-width:900px;margin:auto;padding:16px}canvas{width:100%;height:55vh;display:block;background:#0d1b24;border-radius:12px;touch-action:none}button{padding:8px;background:#182e39;color:#f0fdfa;border:1px solid #2d6971;border-radius:6px;margin:4px}button:disabled{opacity:.4}pre{white-space:pre-wrap;max-height:180px;overflow:auto}small{color:#9ab0ba}</style><main><h1>CUBIT-013 · HEXAGONAL BRACE</h1><small>630 hexagons · 12 curvature anchors · 27 constant addresses · 7.5″ per tick · .dlw</small><canvas id="view"></canvas><div id="ports"></div><button id="step">Advance tangent tick</button><button id="close">On-ramp / return</button><button id="rotate">Pause view rotation</button><pre id="state"></pre><small>In-memory action ledger; no external actions. Shell radius normalized to 1; physical scale hypothetical. Torus and port routing are model choices.</small></main><script>const build=function(f){

const cubit=function cubit(mesh){

 const key=p=>p.join(","),adj=coords.flatMap(p=>dirs.map(d=>p.map((x,i)=>x+d[i])).filter(q=>q.every(x=>Math.abs(x)<=1)).map(q=>[key(p),key(q)]));

};
const machine=function machine(c){

};

const mesh=build(8),config=cubit(mesh),engine=machine(config),can=document.getElementById('view'),ctx=can.getContext('2d');let a=.5,t=.35,auto=true,drag=null;const ports=document.getElementById('ports');config.ports.forEach(p=>{const b=document.createElement('button');b.textContent='Off-ramp '+p.name;b.onclick=()=>{engine.open(p.name);report()};ports.appendChild(b)});document.getElementById('step').onclick=()=>{engine.step();report()};document.getElementById('close').onclick=()=>{engine.close();report()};document.getElementById('rotate').onclick=e=>{auto=!auto;e.target.textContent=auto?'Pause view rotation':'Resume view rotation'};function report(){const s=engine.state();document.getElementById('state').textContent=JSON.stringify({root:s.root,active:s.active,tick:s.tick,phaseArcsec:(s.tick%172800)*7.5,events:s.events},null,2);document.getElementById('step').disabled=document.getElementById('close').disabled=!s.active;Array.from(ports.children).forEach(b=>b.disabled=!!s.active)}can.onpointerdown=e=>{auto=false;document.getElementById('rotate').textContent='Resume view rotation';drag=[e.clientX,e.clientY];can.setPointerCapture(e.pointerId)};can.onpointermove=e=>{if(drag){a+=(e.clientX-drag[0])*.01;t+=(e.clientY-drag[1])*.01;drag=[e.clientX,e.clientY]}};can.onpointerup=can.onpointercancel=()=>drag=null;
