name: H015 CERN public metadata harvest
on:
  workflow_dispatch:
    inputs:
      query:
        description: "Optional public CERN catalogue search query"
        required: false
        default: ""
      pages:
        description: "Pages per API (1-10)"
        required: false
        default: "2"
permissions:
  contents: write
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Harvest bounded CERN metadata
        run: python3 cern-public/harvest.py --pages "$PAGES" --size 10 --max-records 40 --query "$QUERY"
        env:
          PAGES: ${{ inputs.pages }}
          QUERY: ${{ inputs.query }}
      - name: Commit metadata snapshot, if changed
        run: |
          git config user.name 'convergence-h015[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cern-public/harvest/
          if ! git diff --cached --quiet; then
            git commit -m "H015: refresh bounded public CERN metadata snapshot"
            git push
          fi
